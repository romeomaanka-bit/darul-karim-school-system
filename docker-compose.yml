services:
  postgres:
    image: postgres:16-alpine
    container_name: darul-karim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darulkarim
      POSTGRES_PASSWORD: darulkarim
      POSTGRES_DB: darul_karim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darulkarim -d darul_karim"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
